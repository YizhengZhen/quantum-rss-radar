  abstract_snippet: Quantum cryptographic conferencing (QCC) holds promise for distributing
    information-theoretic secure keys among multiple users over a long distance. ...
    Combining the idea of postselecting GHZ states and recently proposed twin-field
    quantum-key-distribution protocols, we report a QCC protocol based on weak coherent-state
    interferences named 'phase-matching quantum cryptographic conferencing,' which
    is immune to all detector side-channel attacks. The proposed protocol can improve
    the key-generation rate from O(ηN) to O(ηN−1) compared with the measurement device-independent
    QCC protocols.
  source: pdf
  added_at: '2026-06-08'
