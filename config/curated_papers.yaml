# curated_papers.yaml — Accumulated reference papers for LLM few-shot calibration
#
# HOW IT WORKS:
#   - PDF dropped in config/papers/{tier}/ → LLM analyzes → entry appended here
#   - Pipeline-recommended papers (score ≥ MIN_RELEVANCE_SCORE) → appended here
#   - Each entry is identified by 'id' — no entry is added twice
#   - If you DELETE an entry manually, it stays deleted (not re-added)
#   - If you DELETE the source PDF, the entry here remains
#
# SCORE → TIER MAPPING (MUST match config/research_directions.md Tier Guide):
#   core          7.5 – 10.0   (directly aligned; novel, technically deep)
#   relevant      5.0 –  7.4   (related in topic or method, but not primary focus)
#   not_priority  2.0 –  4.9   (broadly in the field but too applied/narrow)
#   unrelated     0.0 –  1.9   (completely unrelated)
#
# ENTRY FORMAT:
#   id:               unique identifier (arxiv ID preferred, or local_<filename>)
#   title:            paper title
#   direction:        exact H2 heading from research_directions.md, or "General / Other"
#   score:            float 0.0–10.0 (determines tier automatically)
#   tier:             core | relevant | not_priority | unrelated
#   reason:           why this paper has this score (injected into LLM few-shot prompt)
#   abstract_snippet: 100-150 word excerpt (LLM uses this as example input)
#   source:           pdf | pipeline  (how this entry was added)
#   added_at:         ISO date (YYYY-MM-DD)

papers:
- id: local_arnon-friedman_et_al__2019_simple_and_tight_device-independent_security_proofs
  title: SIMPLE AND TIGHT DEVICE-INDEPENDENT SECURITY PROOFS
  direction: Quantum Information
  score: 9.5
  tier: core
  reason: This paper provides device-independent security proofs using the entropy
    accumulation theorem, which is a core focus of Quantum Information. It offers
    asymptotically tight bounds and modular analysis, directly advancing the field
    of quantum cryptography. The work is highly relevant to the researcher's interests
    in entropy measures and security proofs.
  abstract_snippet: 'Device-independent security is the gold standard for quantum
    cryptography: not only is security based entirely on the laws of quantum mechanics,
    but it holds irrespective of any a priori assumptions on the quantum devices used
    in a protocol, making it particularly applicable in a quantum-wary environment.
    ... We introduce a technique for the analysis of device-independent cryptographic
    protocols. We provide a flexible protocol and give a security proof that provides
    quantitative bounds that are asymptotically tight, even in the presence of general
    quantum adversaries. ... As concrete applications we give simple and modular security
    proofs for device-independent quantum key distribution and randomness expansion
    protocols based on the CHSH inequality.'
  source: pdf
  added_at: '2026-06-07'
- id: local_bennett_1982_the_thermodynamics_of_computation_a_review
  title: The Thermodynamics of Computation--a Review
  direction: Information Thermodynamics
  score: 9.2
  tier: core
  reason: This paper is a foundational review directly addressing the thermodynamics
    of computation, including reversible computing, Landauer's principle, and the
    relationship between information and entropy. It is highly relevant to the 'Information
    Thermodynamics' direction as it discusses physical constraints on information
    processing and the thermodynamic cost of logical operations.
  abstract_snippet: Computers may be thought of as engines for transforming free energy
    into waste heat and mathematical work. Existing electronic computers dissipate
    energy vastly in excess of the mean thermal energy kT, for purposes such as maintaining
    volatile storage devices in a bistable condition, synchronizing and standardizing
    signals, and maximizing switching speed. On the other hand, recent models due
    to Fredkin and Toffoli show that in principle a computer could compute at finite
    speed with zero energy dissipation and zero error. In these models, a simple assemblage
    of simple but idealized mechanical parts (e.g., hard spheres and flat plates)
    determines a ballistic trajectory isomorphic with the desired computation, a trajectory
    therefore not foreseen in detail by the builder of the computer.
  source: pdf
  added_at: '2026-06-07'
- id: local_dupuis_et_al__2020_entropy_accumulation
  title: Entropy Accumulation
  direction: Quantum Information
  score: 9.5
  tier: core
  reason: This paper presents the entropy accumulation theorem (EAT), a core result
    in quantum information theory that generalizes the asymptotic equipartition property
    to non-i.i.d. settings. It is directly listed as a core focus under quantum entropy
    measures and is foundational for device-independent security proofs, making it
    highly relevant and impactful.
  abstract_snippet: We ask the question whether entropy accumulates, in the sense
    that the operationally relevant total uncertainty about an n-partite system A
    = (A1, . . . An) corresponds to the sum of the entropies of its parts Ai. The
    Asymptotic Equipartition Property implies that this is indeed the case to first
    order in n—under the assumption that the parts Ai are identical and independent
    of each other. Here we show that entropy accumulation occurs more generally, i.e.,
    without an independence assumption, provided one quantifies the uncertainty about
    the individual systems Ai by the von Neumann entropy of suitably chosen conditional
    states. The analysis of a large system can hence be reduced to the study of its
    parts.
  source: pdf
  added_at: '2026-06-07'
- id: local_horodecki_and_oppenheim_2013_fundamental_limitations_for_quantum_and_nanoscale_thermodynamics
  title: Fundamental limitations for quantum and nanoscale thermodynamics
  direction: Information Thermodynamics
  score: 9.5
  tier: core
  reason: This paper is a seminal work in quantum thermodynamics, deriving necessary
    and sufficient conditions for state transitions (thermo-majorization) valid at
    the nanoscale and for quantum systems. It directly addresses core interests in
    non-equilibrium thermodynamics and work extraction from small systems, making
    it highly relevant and significant for the Information Thermodynamics direction.
  abstract_snippet: 'The relationship between thermodynamics and statistical physics
    is valid in the thermodynamic limit—when the number of particles becomes very
    large. Here we study thermodynamics in the opposite regime—at both the nanoscale
    and when quantum effects become important. Applying results from quantum information
    theory, we construct a theory of thermodynamics in these limits. We derive general
    criteria for thermodynamical state transitions, and, as special cases, find two
    free energies: one that quantifies the deterministically extractable work from
    a small system in contact with a heat bath, and the other that quantifies the
    reverse process. We find that there are fundamental limitations on work extraction
    from non-equilibrium states, owing to finite size effects and quantum coherences.
    This implies that thermodynamical transitions are generically irreversible at
    this scale. As one application of these methods, we analyse the efficiency of
    small heat engines and find that they are irreversible during the adiabatic stages
    of the cycle.'
  source: pdf
  added_at: '2026-06-07'
- id: local_imamo_lu_2009_cavity_qed_based_on_collective_magnetic_dipole_coupling_spin_ensembles_as_hybrid_two-level_systems
  title: 'Cavity QED Based on Collective Magnetic Dipole Coupling: Spin Ensembles
    as Hybrid Two-Level Systems'
  direction: Hybrid Quantum Systems
  score: 9.0
  tier: core
  reason: This paper directly addresses hybrid quantum systems by proposing collective
    magnetic dipole coupling of spin ensembles to a superconducting cavity with a
    transmon qubit, which is a core focus of Direction 4. It provides a theoretical
    framework for a hybrid two-level system, enabling new avenues for quantum information
    processing. The paper is highly relevant as it introduces a platform that combines
    spin ensembles with circuit QED, aligning with the researcher's interests in spin
    ensembles coupled to superconducting circuits.
  abstract_snippet: 'We analyze the magnetic dipole coupling of an ensemble of spins
    to a superconducting microwave stripline structure, incorporating a Josephson
    junction based transmon qubit. We show that this system is described by an embedded
    Jaynes-Cummings model: in the strong coupling regime, collective spin-wave excitations
    of the ensemble of spins pick up the nonlinearity of the cavity mode, such that
    the two lowest eigenstates of the coupled spin wave–microwave cavity–Josephson
    junction system define a hybrid two-level system. The proposal described here
    enables new avenues for nonlinear optics using optical photons coupled to spin
    ensembles via Raman transitions.'
  source: pdf
  added_at: '2026-06-07'
- id: local_kubo_et_al__2011_hybrid_quantum_circuit_with_a_superconducting_qubit_coupled_to_a_spin_ensemble
  title: Hybrid Quantum Circuit with a Superconducting Qubit Coupled to a Spin Ensemble
  direction: Hybrid Quantum Systems
  score: 9.5
  tier: core
  reason: 'This paper directly realizes a core focus of Hybrid Quantum Systems: a
    superconducting qubit coherently coupled to an ensemble of NV centers via a superconducting
    resonator, demonstrating quantum state storage and retrieval. It is a seminal
    experimental proof-of-concept for spin-ensemble quantum memory, highly relevant
    and technically deep.'
  abstract_snippet: We report the experimental realization of a hybrid quantum circuit
    combining a superconducting qubit and an ensemble of electronic spins. The qubit,
    of the transmon type, is coherently coupled to the spin ensemble consisting of
    nitrogen-vacancy centers in a diamond crystal via a frequency-tunable superconducting
    resonator acting as a quantum bus. Using this circuit, we prepare a superposition
    of the qubit states that we store into collective excitations of the spin ensemble
    and retrieve back into the qubit later on. These results constitute a proof of
    concept of spin-ensemble based quantum memory for superconducting qubits.
  source: pdf
  added_at: '2026-06-07'
- id: local_kurizki_et_al__2015_quantum_technologies_with_hybrid_systems
