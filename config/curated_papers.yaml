  abstract_snippet: Device-independent quantum key distribution (DI-QKD) is a key
    application of the quantum internet. We report the realization of DI-QKD between
    two single-atom nodes linked by 100-kilometer (km) fibers. ... We achieved high-fidelity
    atom-atom entanglement and positive asymptotic key rates for fiber lengths up
    to 100 km. At 11 km, 1.2 million heralded Bell pairs were prepared over 624 hours,
    yielding an estimated extractable finite-size secure key rate of 0.112 bits per
    event against general attacks.
  source: pdf
  added_at: '2026-06-07'
- id: local_zhou_et_al__2024_local_unitary_equivalence_of_arbitrary-dimensional_multipartite_quantum_states
  title: Local unitary equivalence of arbitrary-dimensional multipartite quantum states
  direction: Quantum Information
  score: 5.5
  tier: not_priority
  reason: The paper addresses local unitary equivalence, a sub-topic of entanglement
    theory that is not listed as a core focus in the researcher's interests. While
    it proposes useful invariants for arbitrary-dimensional states, the contribution
    is more about classification than direct applications to the researcher's actively
    followed areas in quantum information.
  abstract_snippet: Local unitary equivalence is an important ingredient for quantifying
    and classifying entanglement. Verifying whether or not two quantum states are
    local unitary equivalent is a crucial problem, where only the case of multipartite
    pure states is solved. For mixed states, however, the verification of local unitary
    equivalence is still a challenging problem. In this paper, based on the coefficient
    matrices of generalized Bloch representations of quantum states, we find a variety
    of local unitary invariants for arbitrary-dimensional bipartite quantum states.
    These invariants are operational and can be used as necessary conditions for verifying
    the local unitary equivalence of two quantum states. Furthermore, we extend the
    construction to the arbitrary-dimensional multipartite case. We finally apply
    these invariants to estimate concurrence, a vital entanglement measure, showing
    the practicability of local unitary invariants in characterizing entanglement.
  source: pdf
  added_at: '2026-06-07'
- id: local_zhen_et_al__2023_device-independent_quantum_key_distribution_based_on_the_mermin-peres_magic_square_game
  title: Device-Independent Quantum Key Distribution Based on the Mermin-Peres Magic
    Square Game
  direction: Quantum Information
  score: 9.2
  tier: core
  reason: 'The paper presents a novel DIQKD protocol based on the Mermin-Peres magic
    square game, directly addressing core focus areas: device-independent protocols,
    quantum cryptography security proofs, and nonlocality. It provides an information-theoretic
    security proof against collective attacks and demonstrates a key rate advantage
    over CHSH-based DIQKD, aligning strongly with the researcher''s Quantum Information
    direction.'
  abstract_snippet: 'Device-independent quantum key distribution (DIQKD) is information-theoretically
    secure against adversaries who possess a scalable quantum computer and who have
    supplied malicious key-establishment systems; however, the DIQKD key rate is currently
    too low. Consequently, we devise a DIQKD scheme based on the quantum nonlocal
    Mermin-Peres magic square game: our scheme asymptotically delivers DIQKD against
    collective attacks, even with noise. Our scheme outperforms DIQKD using the Clauser-Horne-Shimony-Holt
    game with respect to the number of game rounds, albeit not number of entangled
    pairs, provided that both state visibility and detection efficiency are high enough.'
  source: pdf
  added_at: '2026-06-08'
- id: local_buscemi_2012_all_entangled_quantum_states_are_nonlocal
  title: All Entangled Quantum States Are Nonlocal
  direction: Quantum Information
  score: 7.5
  tier: relevant
  reason: The paper directly addresses the relationship between entanglement and nonlocality,
    a core topic in quantum information theory. It provides an information-theoretic
    result (necessary and sufficient conditions for LOSR transformations) and shows
    that all entangled states are nonlocal, which is a fundamental contribution to
    entanglement theory. The work is novel and technically deep, fitting the 'Core
    focus' tier for Quantum Information.
  abstract_snippet: Departing from the usual paradigm of local operations and classical
    communication adopted in entanglement theory, we study here the interconversion
    of quantum states by means of local operations and shared randomness. A set of
    necessary and sufficient conditions for the existence of such a transformation
    between two given quantum states is given in terms of the payoff they yield in
    a suitable class of nonlocal games. It is shown that, as a consequence of our
    result, such a class of nonlocal games is able to witness quantum entanglement,
    however weak, and reveal nonlocality in any entangled quantum state.
  source: pdf
  added_at: '2026-06-08'
- id: local_xu_et_al__2022_experimental_demonstration_of_quantum_pseudotelepathy
  title: Experimental Demonstration of Quantum Pseudotelepathy
  direction: Quantum Information
  score: 5.5
  tier: not_priority
  reason: The paper experimentally demonstrates quantum pseudotelepathy via the Mermin-Peres
    magic square game, which is a strong form of nonlocality. This falls under the
    'Also relevant' category of Quantum Information as it involves Bell nonlocality
    and device-independent protocols, but it is an experimental demonstration rather
    than a new information-theoretic result, and the researcher does not actively
    follow experimental nonlocality demonstrations.
  abstract_snippet: Quantum pseudotelepathy is a strong form of nonlocality. Different
    from the conventional nonlocal games where quantum strategies win statistically,
    e.g., the Clauser-Horne-Shimony-Holt game, quantum pseudotelepathy in principle
    allows quantum players to with probability 1. In this Letter, we report a faithful
    experimental demonstration of quantum pseudotelepathy via playing the nonlocal
    version of Mermin-Peres magic square game, where Alice and Bob cooperatively fill
    in a 3 × 3 magic square. We adopt the hyperentanglement scheme and prepare photon
    pairs entangled in both the polarization and the orbital angular momentum degrees
    of freedom, such that the experiment is carried out in a resource-efficient manner.
    Under the locality and fair-sampling assumption, our results show that quantum
    players can simultaneously win all the queries over any classical strategy.
  source: pdf
  added_at: '2026-06-08'
- id: local_xu_et_al__2024_measurement-device-independent_verification_of_quantum_states
  title: Measurement-device-independent verification of quantum states
  direction: Quantum Information
  score: 5.5
  tier: not_priority
  reason: The paper proposes a measurement-device-independent quantum state verification
    scheme, which is a topic in quantum information theory but not a core focus of
    the researcher's interests. It is technically solid and relevant to quantum cryptography
    and verification, but falls under 'also relevant' as it does not directly address
    entanglement theory, Bell nonlocality, or quantum entropy measures.
  abstract_snippet: Efficient and reliable verification of quantum states is central
    to quantum information processing applications. If using well-characterized measurement
    devices, effective methods have been developed for quantum state verification
    (QSV). In reality, however, measurement devices are generally imperfect or untrusted,
    which limits significantly the application of standard QSV protocols. Here, we
    propose the measurement-device-independent QSV (MDI-QSV) scheme for practice.
    With the help of trusted quantum inputs, we have developed a systematical approach
    to design MDI-QSV strategies for an arbitrary pure target state.
  source: pdf
  added_at: '2026-06-08'
- id: local_zhao_et_al__2020_phase-matching_quantum_cryptographic_conferencing
