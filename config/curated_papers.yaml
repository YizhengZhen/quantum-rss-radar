- id: local_luo_et_al__2023_general_limit_to_thermodynamic_annealing_performance
  title: General limit to thermodynamic annealing performance
  direction: Information Thermodynamics
  score: 9.2
  tier: core
  reason: This paper directly addresses thermodynamic annealing performance using
    stochastic thermodynamics, deriving a general bound on convergence to the ground
    state in finite time. It employs methods from finite-time thermodynamics and entropy
    production, which are core to the researcher's focus on non-equilibrium quantum
    thermodynamics and speed limits. The work provides a general framework to assess
    annealing performance from accessible parameters, making it highly relevant.
  abstract_snippet: Annealing has proven highly successful in finding minima in a
    cost landscape. Yet, depending on the landscape, systems often converge towards
    local minima rather than global ones. In this Letter, we analyze the conditions
    for which annealing is approximately successful in finite time. We connect annealing
    to stochastic thermodynamics to derive a general bound on the distance between
    the system state at the end of the annealing and the ground state of the landscape.
    This distance depends on the amount of state updates of the system and the accumulation
    of nonequilibrium energy, two protocol and energy landscape-dependent quantities
    which we show are in a trade-off relation. We describe how to bound the two quantities
    both analytically and physically. This offers a general approach to assess the
    performance of annealing from accessible parameters, both for simulated and physical
    implementations.
  source: pdf
  added_at: '2026-06-07'
- id: local_zhen_et_al__2021_universal_bound_on_energy_cost_of_bit_reset_in_finite_time
  title: Universal Bound on Energy Cost of Bit Reset in Finite Time
  direction: Information Thermodynamics
  score: 9.5
  tier: core
  reason: 'This paper directly addresses a core focus of Information Thermodynamics:
    the energy cost of bit reset in finite time, extending Landauer''s principle with
    a universal bound. It provides a hardware-independent lower bound on work penalty
    as a function of time and reset error, which is a fundamental physical constraint
    on information processing. The result is novel and highly relevant to the researcher''s
    interests.'
  abstract_snippet: We consider how the energy cost of bit reset scales with the time
    duration of the protocol. Bit reset necessarily takes place in finite time, where
    there is an extra penalty on top of the quasistatic work cost derived by Landauer.
    This extra energy is dissipated as heat in the computer, inducing a fundamental
    limit on the speed of irreversible computers. We formulate a hardware-independent
    expression for this limit in the framework of stochastic processes. We derive
    a closed-form lower bound on the work penalty as a function of the time taken
    for the protocol and bit reset error.
  source: pdf
  added_at: '2026-06-07'
- id: local_bennett_2003_notes_on_landauer_s_principle__reversible_computation__and_maxwell_s_demon
  title: Notes on Landauer's principle, reversible computation, and Maxwell's Demon
  direction: Information Thermodynamics
  score: 7.5
  tier: relevant
  reason: This paper directly addresses Landauer's principle, reversible computation,
    and Maxwell's Demon—core topics in information thermodynamics. It is a foundational
    commentary by a leading researcher, though it does not present novel results,
    placing it at the upper end of the 'relevant' tier.
  abstract_snippet: Landauer's principle, often regarded as the basic principle of
    the thermodynamics of information processing, holds that any logically irreversible
    manipulation of information, such as the erasure of a bit or the merging of two
    computation paths, must be accompanied by a corresponding entropy increase in
    non-information-bearing degrees of freedom of the information-processing apparatus
    or its environment. Conversely, it is generally accepted that any logically reversible
    transformation of information can in principle be accomplished by an appropriate
    physical mechanism operating in a thermodynamically reversible fashion. These
    notions have sometimes been criticized either as being false, or as being trivial
    and obvious, and therefore unhelpful for purposes such as explaining why Maxwell's
    Demon cannot violate the second law of thermodynamics. Here I attempt to refute
    some of the arguments against Landauer's principle...
  source: pdf
  added_at: '2026-06-07'
- id: local_brand_o_et_al__2015_the_second_laws_of_quantum_thermodynamics
  title: The second laws of quantum thermodynamics
  direction: Information Thermodynamics
  score: 7.9
  tier: relevant
  reason: This paper is a foundational contribution to quantum thermodynamics, presenting
    a family of second laws that generalize the traditional free energy constraint.
    It directly aligns with the researcher's core interest in non-equilibrium quantum
    thermodynamics and information-theoretic constraints on state transformations.
    Given the researcher's classification as 'relevant', it merits a high score within
    that tier.
  abstract_snippet: The second law of thermodynamics places constraints on state transformations.
    It applies to systems composed of many particles, however, we are seeing that
    one can formulate laws of thermodynamics when only a small number of particles
    are interacting with a heat bath. Is there a second law of thermodynamics in this
    regime? Here, we find that for processes which are approximately cyclic, the second
    law for microscopic systems takes on a different form compared to the macroscopic
    scale, imposing not just one constraint on state transformations, but an entire
    family of constraints. We find a family of free energies which generalize the
    traditional one, and show that they can never increase.
  source: pdf
  added_at: '2026-06-07'
- id: local_broadbent_et_al__2009_universal_blind_quantum_computation
  title: Universal Blind Quantum Computation
  direction: Quantum Information
  score: 7.6
  tier: relevant
  reason: This paper introduces a blind quantum computation protocol using measurement-based
    quantum computing, directly aligning with the researcher's interest in quantum
    cryptography and private delegation of quantum computing. It is a foundational
    theoretical result in quantum information, fitting the 'relevant' tier with high
    impact.
  abstract_snippet: 'We present a protocol which allows a client to have a server
    carry out a quantum computation for her such that the client''s inputs, outputs
    and computation remain perfectly private, and where she does not require any quantum
    computational power or memory. The client only needs to be able to prepare single
    qubits randomly chosen from a finite set and send them to the server, who has
    the balance of the required quantum computational resources. Our protocol is interactive:
    after the initial preparation of quantum states, the client and server use two-way
    classical communication which enables the client to drive the computation, giving
    single-qubit measurement instructions to the server, depending on previous measurement
    outcomes. Our protocol works for inputs and outputs that are either classical
    or quantum. We give an authentication protocol that allows the client to detect
    an interfering server; our scheme can also be made fault-tolerant.'
  source: pdf
  added_at: '2026-06-07'
- id: local_lu_et_al__2026_device-independent_quantum_key_distribution_over_100_km_with_single_atoms
  title: Device-independent quantum key distribution over 100 km with single atoms
