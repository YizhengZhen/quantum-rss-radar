# Quantum RSS Radar — RSS Sources Configuration
#
# 每个 feed 独立声明全部字段（逻辑清楚，不同期刊影响力可分别调节）：
#   - name:              feed 标识（唯一，用于过滤/报表）
#   - url:               RSS 源地址
#   - source:            PaperSource 枚举值（arxiv|aps|nature|science|ieee|acm|springer|other）
#   - display_name:      邮件/网站标签显示名（期刊缩写）
#   - color:             邮件卡片与网站标签色块
#   - max_items:         每次运行最多推荐几篇（按分数取前 N；-1 = 不限制）
#   - min_score:         最低推荐分数 0-10（低于此不推荐）
#   - update_frequency:  触发频率，也是邮件分组依据——相同频率的 feed 合并为一封邮件：
#       daily   → 每天                          (Daily Digest)
#       weekday → 周一至周五                    (Weekday Digest, 例: arXiv 组)
#       weekly  → 每周日                        (Weekly Digest, 例: PRL/npj 等期刊组)
#       monthly → 每月 1 号                     (Monthly Digest, 例: Nature/Science 组)
#       season  → 季度首日 (1/1,4/1,7/1,10/1)  (Seasonal Digest)

feeds:
  # ── arXiv（工作日邮件组）────────────────────────────────
  - name: "arXiv Physics"
    url: "https://rss.arxiv.org/rss/quant-ph+cond-mat.stat-mech+math-ph+physics.soc-ph+physics.pop-ph+physics.optics+physics.comp-ph+physics.atom-ph+physics.atm-clus"
    source: "arxiv"
    display_name: "arXiv"
    color: "#B31B1B"
    max_items: -1
    min_score: 7.5
    update_frequency: weekday

  - name: "arXiv Math"
