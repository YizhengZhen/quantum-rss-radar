# Quantum RSS Radar - RSS Sources Configuration
# For testing, only arXiv Quantum Physics (quant-ph) is enabled
# Add more sources after initial testing is successful

feeds:
  # ====== PRIMARY TEST SOURCE ======
  # arXiv Quantum Physics - Primary source for testing
  - name: "arXiv Quantum Physics"
    url: "http://arxiv.org/rss/quant-ph"
    category: "quantum_physics"
    source: "arxiv"
    max_items: 50  # Limit to 50 papers for testing
    update_frequency:
      type: "daily"

