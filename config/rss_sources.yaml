# Quantum RSS Radar - RSS Sources Configuration
# For testing, only arXiv Quantum Physics (quant-ph) is enabled
# Add more sources after initial testing is successful

feeds:

  - name: "arXiv Physics"
    url: "https://rss.arxiv.org/rss/quant-ph+cond-mat.stat-mech+math-ph+physics.soc-ph+physics.pop-ph+physics.optics+physics.comp-ph+physics.atom-ph+physics.atm-clus"
    source: "arxiv"
    max_items: -1  # Unlimited
    update_frequency:
      type: "daily"

  - name: "arXiv Math"
    url: "https://rss.arxiv.org/rss/math.DS+math.FA+math.GM+math.HO+math.IT+math.NA+math.OC+math.QA+math.ST+stat.TH"
    source: "arxiv"
    max_items: -1  # Unlimited
    update_frequency:
      type: "daily"

  - name: "arXiv Computer Science"
    url: "https://rss.arxiv.org/rss/cs.CC+cs.CR+cs.ET+cs.GT+cs.IT+cs.LO"
    source: "arxiv"
    max_items: -1  # Unlimited
    update_frequency:
      type: "daily"  


  # Nature Physics
  - name: "Nature Physics"
    url: "https://www.nature.com/nphys.rss"
    source: "nature"
    max_items: -1  # Unlimited
    update_frequency:
      type: "weekdays"

  # Physical Review Letters
  - name: "Physical Review Letters"
    url: "https://journals.aps.org/prl/rss"
    source: "aps"
    max_items: -1  # Unlimited
    update_frequency:
      type: "weekdays"

  # Science Magazine
  - name: "Science Magazine"
    url: "https://www.science.org/rss/current.xml"
    source: "science"
    max_items: -1  # Unlimited
    update_frequency:
      type: "weekdays"

  # IEEE Transactions on Quantum Engineering
  - name: "IEEE Transactions on Quantum Engineering"
    url: "https://ieeexplore.ieee.org/rss/TOC94.XML"
    source: "ieee"
    max_items: -1  # Unlimited
    update_frequency:
      type: "weekdays"

sources:
  # Each source maps to a color tag on the website
  arxiv:
    display_name: "arXiv"
    color: "#B31B1B"
  nature:
    display_name: "Nature"
    color: "#009688"
  science:
    display_name: "Science"
    color: "#1565C0"
  aps:
    display_name: "APS"
    color: "#7B1FA2"
  ieee:
    display_name: "IEEE"
    color: "#F57C00"
  acm:
    display_name: "ACM"
    color: "#00897B"
  springer:
    display_name: "Springer"
    color: "#5D4037"
  other:
    display_name: "Other"
    color: "#757575"
