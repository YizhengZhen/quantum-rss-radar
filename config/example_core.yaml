id: "arxiv_2308.01432"
title: "Entropy Accumulation Under Post-Quantum Cryptographic Assumptions"
direction: "Quantum Information Theory & Foundations"
expected_score: 9.0
tier: "core"
reason: |
  This paper directly proves entropy accumulation theorems under minimal assumptions,
  which is foundational for device-independent QKD and quantum network security proofs.
  It combines Bell nonlocality, quantum channel theory, and information theory —
  all three at the core of our research interests. This is the type of paper that
  warrants a score of 9+: novel result, technically deep, directly actionable.
abstract_snippet: |
  We prove a general entropy accumulation theorem showing that in a sequential process
  where each step satisfies a certain "non-signalling" condition, the total smooth
  min-entropy accumulates at a rate given by the single-step von Neumann entropy.
  Our result extends previous entropy accumulation theorems and applies directly
  to device-independent cryptographic protocols, yielding tight security bounds
  for measurement-device-independent QKD.
