# Quantum RSS Radar - Docker Compose Configuration
# For local development, testing, and production deployment

version: '3.8'

services:
  quantum-rss-radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum-rss-radar
    restart: unless-stopped
    volumes:
      # Mount configuration files
      - ./config:/app/config:ro
      # Mount data directories for persistence
      - ./data:/app/data
    environment:
      # LLM API Key (Generic OpenAI-compatible)
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Optional LLM settings
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # Email configuration
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_SENDER=${EMAIL_SENDER:-}
      - EMAIL_RECIPIENT=${EMAIL_RECIPIENT:-}
      - EMAIL_SMTP_SERVER=${EMAIL_SMTP_SERVER:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USERNAME=${EMAIL_SMTP_USERNAME:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
    # Run the pipeline daily
    command: >
      sh -c "
        python -m src.orchestrator_jekyll --format all &&
        echo 'Pipeline completed. Container will restart on next schedule.'
      "
