[project]
name = "quantum-rss-radar"
version = "0.1.0"
description = "AI-assisted daily academic research tracking system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openai>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
quantum-rss-radar = "src.orchestrator:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
