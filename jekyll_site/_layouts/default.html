<!DOCTYPE html>
<html lang="en" data-theme="{{ site.theme | default: 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if page.title %}
            {{ page.title }} - {{ site.title }}
        {% else %}
            {{ site.title }} - {{ site.description }}
        {% endif %}
    </title>
    
    <!-- Theme initialization to prevent flash -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/category-colors.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/category-stats.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Alpine.js for interactivity -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    {% seo %}
</head>
<body x-data="app()">
    <!-- Header (banner) -->
    {% include header.html %}
    
    <!-- Navigation and search -->
    {% include navigation.html %}
    
    <!-- Main content -->
    <main class="container">
        {{ content }}
    </main>
    
    <!-- Footer -->
    {% include footer.html %}
    
    <!-- Modal for AI summary -->
    {% include modal.html %}
    
    <!-- JavaScript -->
    <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</body>
</html>
