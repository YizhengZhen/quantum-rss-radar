<div class="modal-overlay" x-show="modalOpen" @click="closeModal()" x-cloak>
    <div class="modal-content" @click.stop>
        <button class="modal-close" @click="closeModal()">
            <i class="fas fa-times"></i>
        </button>
        
        <template x-if="selectedPaper">
            <div class="paper-modal">
                <div class="modal-header">
                    <div class="modal-score">
                        <span x-text="selectedPaper.score.toFixed(1)"></span>
                    </div>
                    <h2 x-text="selectedPaper.title"></h2>
                    <div class="modal-badges">
                        <span class="modal-badge" x-show="selectedPaper.recommended">⭐ Recommended</span>
                        <span class="modal-source" x-text="selectedPaper.source.toUpperCase()"></span>
                    </div>
                </div>
                
                <div class="modal-body">
                    <div class="modal-authors">
                        <strong>Authors:</strong> <span x-text="selectedPaper.authors.join(', ')"></span>
                    </div>
                    
                    <div class="modal-categories">
                        <strong>Category:</strong> 
                        <span class="modal-category" :style="categoryStyle(selectedPaper.category)" 
                              x-text="getCategoryName(selectedPaper.category)"></span>
                    </div>
                    
                    <div class="modal-pubdate">
                        <strong>Published:</strong> <span x-text="formatDate(selectedPaper.published_date)"></span>
                    </div>
                    
                    <div class="modal-link">
                        <strong>Link:</strong> 
                        <a :href="selectedPaper.link" target="_blank" x-text="selectedPaper.link"></a>
                    </div>
                    
                    <div class="modal-abstract">
                        <h3><i class="fas fa-file-alt"></i> Abstract</h3>
                        <div class="abstract-text" x-text="selectedPaper.abstract"></div>
                    </div>
                    
                    <div class="modal-analysis">
                        <h3><i class="fas fa-brain"></i> AI Analysis</h3>
                        <div class="analysis-grid">
                            <div class="analysis-item">
                                <h4>TL;DR</h4>
                                <p x-text="selectedPaper.analysis.tldr"></p>
                            </div>
                            <div class="analysis-item">
                                <h4>Motivation</h4>
                                <p x-text="selectedPaper.analysis.motivation"></p>
                            </div>
                            <div class="analysis-item">
                                <h4>Method</h4>
                                <p x-text="selectedPaper.analysis.method"></p>
                            </div>
                            <div class="analysis-item">
                                <h4>Result</h4>
                                <p x-text="selectedPaper.analysis.result"></p>
                            </div>
                            <div class="analysis-item">
                                <h4>Conclusion</h4>
                                <p x-text="selectedPaper.analysis.conclusion"></p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-recommendation">
                        <h3><i class="fas fa-star"></i> Recommendation</h3>
                        <div class="recommendation-box">
                            <div class="score-display">
                                <strong>Relevance Score:</strong> 
                                <span class="score-value" x-text="selectedPaper.score.toFixed(1)"></span>/10
                            </div>
                            <div class="recommendation-verdict">
                                <strong>Recommendation:</strong> 
                                <span class="verdict" :class="selectedPaper.recommended ? 'recommended' : 'not-recommended'">
                                    <span x-text="selectedPaper.recommended ? 'YES - Read this paper' : 'NO - Lower priority'"></span>
                                </span>
                            </div>
                            <div class="reasoning" x-show="selectedPaper.analysis.reasoning">
                                <strong>Reasoning:</strong> 
                                <p x-text="selectedPaper.analysis.reasoning"></p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button class="btn-secondary" @click="closeModal()">
                        <i class="fas fa-times"></i> Close
                    </button>
                    <a :href="selectedPaper.link" target="_blank" class="btn-primary">
                        <i class="fas fa-external-link-alt"></i> Open Paper
                    </a>
                    <button class="btn-secondary" @click="toggleBookmark(selectedPaper)">
                        <i class="far" :class="isBookmarked(selectedPaper) ? 'fa-bookmark' : 'fa-bookmark'"></i>
                        <span x-text="isBookmarked(selectedPaper) ? 'Bookmarked' : 'Bookmark'"></span>
                    </button>
                </div>
            </div>
        </template>
    </div>
</div>
