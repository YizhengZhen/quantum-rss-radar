name: Quantum RSS Radar - Daily Pipeline

on:
  schedule:
    # Run daily at 8 AM UTC
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [master]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/daily-pipeline.yaml"
      - "jekyll_site/**"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync

      - name: Run Quantum RSS Radar
        continue-on-error: true
        env:
          # LLM Configuration (required)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

          # Optional LLM settings
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

          # Optional Email Configuration
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
        run: |
          source .venv/bin/activate
          echo "Running Quantum RSS Radar with environment variable configuration:"
          echo "  LLM_BASE_URL: ${LLM_BASE_URL:-Not set (using default)}"
          echo "  LLM_MODEL: ${LLM_MODEL:-Not set (using default: deepseek-chat)}"
          echo "  LLM_API_KEY: ${LLM_API_KEY:0:10}... (first 10 chars)"
          echo "  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}"

          # Run the orchestrator (Jekyll version)
          python -m src.orchestrator_jekyll --format all

      - name: Setup Ruby and Bundler
        if: always()
        run: |
          echo "Setting up Ruby and Bundler for Jekyll..."
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install bundler

      - name: Install Jekyll Dependencies
        if: always()
        run: |
          echo "Installing Jekyll dependencies..."
          cd jekyll_site

          # Check if Gemfile exists
          if [ ! -f "Gemfile" ]; then
            echo "No Gemfile found, skipping Jekyll build"
            exit 0
          fi

          # Clean install of gems (install locally)
          echo "Installing Jekyll dependencies..."
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll Site
        if: success()
        env:
          JEKYLL_BASEURL: ${{ secrets.PUBLIC_REPO_NAME }}
        run: |
          echo "Building Jekyll site..."
          cd jekyll_site

          # Set baseurl for GitHub Pages deployment (e.g., /qfqe-new-papers)
          # If PUBLIC_REPO_NAME is not set, default to /qfqe-new-papers
          BASEURL="${JEKYLL_BASEURL:-/qfqe-new-papers}"
          echo "Using baseurl: $BASEURL"

          # Build Jekyll site with proper baseurl for sub-path deployment
          bundle exec jekyll build --trace --baseurl "$BASEURL"

          # Verify build output
          if [ -d "_site" ]; then
            echo "Jekyll site built successfully in _site directory"
            ls -la _site/
          else
            echo "Error: Jekyll site not built properly"
            exit 1
          fi

      - name: Deploy to Public Repository
        if: success()
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          source .venv/bin/activate
          echo "Deploying to public repository..."

          # Check if public repository configuration is set
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "Warning: PUBLIC_REPO_TOKEN not set. Skipping public repository deployment."
            echo "To enable public repository deployment, set PUBLIC_REPO_TOKEN GitHub Secret."
            exit 0
          fi

          # Run deployment script
          python scripts/deploy_to_public_repo.py \
            --source-dir jekyll_site/_site \
          --public-repo-url "https://github.com/${{ github.repository_owner }}/qfqe-new-papers.git" \
            --branch main \
            --token "$PUBLIC_REPO_TOKEN"

          echo "✅ Public repository deployment completed"

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: |
            data/all/*.jsonl
            data/reports/*.md
          if-no-files-found: warn
          retention-days: 7

      - name: Create deployment summary
        if: always()
        env:
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
        run: |
          echo "## Quantum RSS Radar Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for processed papers (latest JSONL — actual filename: data_*.jsonl)
          LATEST_JSONL=$(ls -t data/all/data_*.jsonl 2>/dev/null | head -1)
          if [ -n "$LATEST_JSONL" ]; then
            PAPER_COUNT=$(wc -l < "$LATEST_JSONL")
            echo "**Papers Analyzed:** $PAPER_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "**JSONL file:** \`$LATEST_JSONL\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Papers Analyzed:** ⚠️ No JSONL file found (pipeline may have failed)" >> $GITHUB_STEP_SUMMARY
          fi

          # Check for generated Markdown report
          LATEST_MD=$(ls -t data/reports/report_*.md 2>/dev/null | head -1)
          if [ -n "$LATEST_MD" ]; then
            MD_LINES=$(wc -l < "$LATEST_MD")
            echo "**Markdown report:** \`$LATEST_MD\` ($MD_LINES lines)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Markdown report:** ⚠️ Not found" >> $GITHUB_STEP_SUMMARY
          fi

          # Check for generated website files
          if [ -d "jekyll_site/_site" ]; then
            WEB_FILES=$(find jekyll_site/_site -type f -name "*.html" | wc -l)
            echo "**Website Files Generated:** $WEB_FILES HTML files" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Email configuration check
          echo "### 📧 Email Configuration" >> $GITHUB_STEP_SUMMARY
          if [ "${EMAIL_ENABLED}" = "true" ]; then
            echo "- EMAIL_ENABLED: ✅ true" >> $GITHUB_STEP_SUMMARY
          else
            echo "- EMAIL_ENABLED: ❌ not enabled (set GitHub Secret EMAIL_ENABLED=true to enable)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for public repository deployment
          if [ -n "${{ secrets.PUBLIC_REPO_TOKEN }}" ]; then
            echo "**Public Repository:** Deployed to qfqe-new-papers" >> $GITHUB_STEP_SUMMARY
            echo "**Public Website:** https://${{ github.repository_owner }}.github.io/qfqe-new-papers/" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Public Repository:** Not configured (set PUBLIC_REPO_TOKEN to enable)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- LLM Provider: Generic OpenAI-compatible API" >> $GITHUB_STEP_SUMMARY
          echo "- RSS Sources: arXiv Quantum Physics (quant-ph)" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Secrets used: LLM_API_KEY, LLM_BASE_URL, LLM_MODEL, PUBLIC_REPO_TOKEN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** Dual-repository (private dev + public static site)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline completed successfully!" >> $GITHUB_STEP_SUMMARY
