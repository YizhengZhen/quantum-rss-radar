name: Quantum RSS Radar - Daily Pipeline

on:
  schedule:
    # Run daily at 2:00 PM Beijing Time (UTC+8 → UTC 6:00).
    # Must run AFTER arXiv's daily refresh (~midnight US Eastern = ~12:00
    # Beijing) so mainland China fetches the SAME day's listings; the old
    # 10:00 Beijing run caught only the previous day's arXiv content.
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [master]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/daily-pipeline.yaml"
      - "jekyll_site/**"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 push 到 data 分支

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────
      # Fetch the JSONL archive (history) from the `data` branch so the
      # digest engine and quarterly web view can aggregate previous runs.
      # This is the ONLY history that persists across CI runs.
      # ─────────────────────────────────────────────────────────────────
      - name: Fetch archive from data branch
        run: |
          mkdir -p data/all
          if git ls-remote --heads origin data | grep -q "refs/heads/data"; then
            git fetch origin data:data --depth=1
            if git cat-file -e data:data/all 2>/dev/null; then
              git archive data data/all | tar -x -C .
              COUNT=$(find data/all -name 'data_*.jsonl' 2>/dev/null | wc -l)
              echo "✅ Fetched $COUNT archive file(s) from data branch"
            else
              echo "data branch exists but has no data/all yet — starting fresh"
            fi
          else
            echo "data branch does not exist yet — starting fresh archive"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync

      - name: Run Quantum RSS Radar
        continue-on-error: true
        env:
          # LLM Configuration (required)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

          # Optional LLM settings
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

          # Optional Email Configuration
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}

          # Optional Email / Quarterly settings
          ARCHIVE_DIR: ${{ secrets.ARCHIVE_DIR }}
          QUARTER_WINDOW_DAYS: ${{ secrets.QUARTER_WINDOW_DAYS }}
          QUARTERLY_TOP_N: ${{ secrets.QUARTERLY_TOP_N }}
          ARXIV_DOI_ENRICH: ${{ secrets.ARXIV_DOI_ENRICH }}
        run: |
          source .venv/bin/activate
          echo "Running Quantum RSS Radar with environment variable configuration:"
          echo "  LLM_BASE_URL: ${LLM_BASE_URL:-Not set (using default)}"
          echo "  LLM_MODEL: ${LLM_MODEL:-Not set (using default: deepseek-chat)}"
          echo "  LLM_API_KEY: ${LLM_API_KEY:0:10}... (first 10 chars)"
          echo "  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}"

          # Run the orchestrator (Jekyll version)
          python -m src.orchestrator_jekyll --format all

          # ── Save log to /tmp so it's accessible after branch switch ──
          cp quantum_rss_radar_jekyll.log /tmp/pipeline.log 2>/dev/null || true
          # Extract email-related lines for the summary
          grep -iE "email|EMAIL" /tmp/pipeline.log 2>/dev/null \
            | grep -v "PASSWORD\|password\|smtp_pass" \
            > /tmp/email_status.txt || true

      - name: Setup Ruby and Bundler
        if: always()
        run: |
          echo "Setting up Ruby and Bundler for Jekyll..."
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install bundler

      - name: Install Jekyll Dependencies
        if: always()
        run: |
          echo "Installing Jekyll dependencies..."
          cd jekyll_site

          # Check if Gemfile exists
          if [ ! -f "Gemfile" ]; then
            echo "No Gemfile found, skipping Jekyll build"
            exit 0
          fi

          # Clean install of gems (install locally)
          echo "Installing Jekyll dependencies..."
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll Site
        if: success()
        env:
          JEKYLL_BASEURL: ${{ secrets.PUBLIC_REPO_NAME }}
        run: |
          echo "Building Jekyll site..."
          cd jekyll_site

          # Set baseurl for GitHub Pages deployment
          # Use PUBLIC_REPO_NAME secret, or default to repository name
          BASEURL="${JEKYLL_BASEURL:-/${{ github.event.repository.name }}}"
          echo "Using baseurl: $BASEURL"

          # Build Jekyll site with proper baseurl for sub-path deployment
          bundle exec jekyll build --trace --baseurl "$BASEURL"

          # Verify build output
          if [ -d "_site" ]; then
            echo "Jekyll site built successfully in _site directory"
            ls -la _site/
          else
            echo "Error: Jekyll site not built properly"
            exit 1
          fi

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: |
            data/all/**/*.jsonl
            data/reports/*.md
          if-no-files-found: warn
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────
      # Push generated data files to the `data` branch.
      # • Files are committed under data/all/ and data/reports/
      # • Files whose filename-date is older than 6 months are auto-deleted
      # • Requires: job-level `permissions: contents: write` (already set)
      # ─────────────────────────────────────────────────────────────────
      - name: Push data to data branch
        if: always()
        run: |
          # ── Save new files to /tmp before any branch switching ──────
          # data/all is now per-source (data/all/<source>/data_*.jsonl), so
          # stage the whole tree to preserve the layout.
          mkdir -p /tmp/quantum-new-data
          # Only data/all is fetched from the data branch; data/reports is
          # produced by the pipeline. If the pipeline failed before writing
          # reports (e.g. a transient RSS/network outage), the dir may not
          # exist — guard the copies so this step never hard-fails on that.
          if [ -d data/all ];     then cp -r data/all     /tmp/quantum-new-data/all;     else mkdir -p /tmp/quantum-new-data/all;     fi
          if [ -d data/reports ]; then cp -r data/reports /tmp/quantum-new-data/reports; else mkdir -p /tmp/quantum-new-data/reports; fi

          HAS_FILES=$(find /tmp/quantum-new-data/all /tmp/quantum-new-data/reports \
                            -type f \( -name 'data_*.jsonl' -o -name 'report_*.md' \) \
                            2>/dev/null | wc -l)
          if [ "$HAS_FILES" -eq 0 ]; then
            echo "No data files generated this run, skipping data branch push"
            exit 0
          fi

          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"

          # ── Commit curated_papers.yaml back to master if modified ────
          # The pipeline (Step 1.5) appends to curated_papers.yaml when
          # new PDFs are found. This must be committed before switching
          # branches; otherwise git checkout data aborts with
          # "would be overwritten" error.
          # We pull --rebase first because other commits (e.g. docs pushes
          # from a developer's machine) may have landed on master after this
          # workflow started, which would cause the push to be rejected.
          if ! git diff --quiet config/curated_papers.yaml 2>/dev/null; then
            git add config/curated_papers.yaml
            git commit -m "auto: update curated_papers.yaml [$(date -u '+%Y-%m-%d')]"
            git pull --rebase origin master
            git push origin master
            echo "✅ curated_papers.yaml committed to master"
          else
            echo "curated_papers.yaml unchanged, skipping commit"
          fi

          # ── Remove untracked files that would conflict with checkout ─
          # Jekyll installs vendor gems as untracked files; must remove
          # before switching branches to avoid "would be overwritten" error
          rm -rf jekyll_site/vendor jekyll_site/.bundle 2>/dev/null || true

          # ── Checkout or create the data branch ──────────────────────
          if git ls-remote --heads origin data | grep -q "refs/heads/data"; then
            git fetch origin data:data --depth=1
            git checkout data
          else
            echo "data branch does not exist — creating orphan branch..."
            git checkout --orphan data
            git rm -rf . --quiet 2>/dev/null || true
            # Remove all non-git files/dirs except what we need
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
            mkdir -p data/all data/reports
            cat > README.md << 'EOREADME'
          # Quantum RSS Radar — Data Archive

          This branch stores auto-generated daily pipeline outputs:
          - `data/all/<source>/data_YYYY-MM-DD_HHMMSS.jsonl` — per-source papers (one JSON per line)
          - `data/reports/report_YYYY-MM-DD_HHMMSS.md` — human-readable Markdown report

          **Retention policy:** files older than 6 months are automatically removed.
          **Source code** is on the `master` branch.
          EOREADME
          fi

          # ── Copy new data files into the branch ─────────────────────
          mkdir -p data/all data/reports
          cp -r /tmp/quantum-new-data/all/.      data/all/
          cp -r /tmp/quantum-new-data/reports/.  data/reports/

          # ── Remove files whose filename-date is older than 6 months ─
          CUTOFF=$(date -u -d "6 months ago" +%Y-%m-%d)
          REMOVED=0
          for f in $(find data/all -name 'data_*.jsonl') $(find data/reports -name 'report_*.md'); do
            [ -f "$f" ] || continue
            FILE_DATE=$(basename "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            [ -z "$FILE_DATE" ] && continue
            if [[ "$FILE_DATE" < "$CUTOFF" ]]; then
              echo "  Removing expired file: $f  (date: $FILE_DATE < cutoff: $CUTOFF)"
              git rm -f "$f" 2>/dev/null || rm -f "$f"
              REMOVED=$((REMOVED + 1))
            fi
          done
          [ "$REMOVED" -gt 0 ] && echo "Removed $REMOVED expired file(s)" || echo "No expired files found"

          # ── Commit and push ─────────────────────────────────────────
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new to commit on data branch"
          else
            NEW_JSONL=$(find /tmp/quantum-new-data/all -name 'data_*.jsonl'    2>/dev/null | wc -l)
            NEW_MD=$(find    /tmp/quantum-new-data/reports -name 'report_*.md' 2>/dev/null | wc -l)
            git commit -m "data: $(date -u '+%Y-%m-%d') — ${NEW_JSONL} JSONL, ${NEW_MD} MD (removed: ${REMOVED})"
            git push origin data
            echo "✅ Data pushed to data branch ($(git rev-parse --short HEAD))"
          fi

      # ─────────────────────────────────────────────────────────────────
      # Upload Markdown reports to OneDrive via rclone.
      #
      # 【One-time setup — run locally before first use】
      #   1. Install rclone:  https://rclone.org/downloads/
      #   2. Configure OneDrive:
      #        rclone config
      #        → New remote → name: onedrive
      #        → Storage type: onedrive
      #        → Leave client_id / client_secret blank
      #        → Follow the browser OAuth flow
      #   3. Export the config:
      #        rclone config show
      #   4. Copy the ENTIRE output and save it as GitHub Secret:
      #        Secret name:  RCLONE_CONF
      #        Secret value: <paste rclone config content>
      #
      # Files are uploaded to:  QuantumRSSRadar/{YEAR}/{MONTH}/report_*.md
      # e.g.                     QuantumRSSRadar/2026/05/report_2026-05-14_073436.md
      # ─────────────────────────────────────────────────────────────────
      - name: Upload MD report to OneDrive
        if: always()
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "⏭ RCLONE_CONF secret not set — skipping OneDrive upload"
            echo "   See step comments for one-time setup instructions."
            exit 0
          fi

          # ── Install rclone ───────────────────────────────────────────
          curl -s https://rclone.org/install.sh | sudo bash

          # ── Write rclone config from secret ─────────────────────────
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          # ── Find MD files (prefer /tmp save, fallback to data/) ──────
          MD_SOURCE="/tmp/quantum-new-data/reports"
          if [ ! -d "$MD_SOURCE" ] || [ -z "$(ls $MD_SOURCE/*.md 2>/dev/null)" ]; then
            MD_SOURCE="data/reports"
          fi
          if [ -z "$(ls $MD_SOURCE/*.md 2>/dev/null)" ]; then
            echo "⚠ No MD files found — skipping OneDrive upload"
            exit 0
          fi

          # ── Upload to QuantumRSSRadar/{YEAR}/{MONTH}/ ────────────────
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          ONEDRIVE_FOLDER="QuantumRSSRadar/${YEAR}/${MONTH}"
          echo "Uploading to OneDrive: ${ONEDRIVE_FOLDER}/"
          rclone copy "$MD_SOURCE/" "onedrive:${ONEDRIVE_FOLDER}/" \
            --include "*.md" \
            --progress \
            --stats-log-level NOTICE
          echo "✅ MD reports uploaded to OneDrive: ${ONEDRIVE_FOLDER}/"
          ls -lh $MD_SOURCE/*.md

      - name: Create deployment summary
        if: always()
        env:
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
        run: |
          echo "## Quantum RSS Radar Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for processed papers (latest JSONL across per-source subdirs)
          LATEST_JSONL=$(find data/all -name 'data_*.jsonl' 2>/dev/null \
                          | while read f; do echo "$(basename "$f") $f"; done \
                          | sort | tail -1 | cut -d' ' -f2-)
          if [ -n "$LATEST_JSONL" ]; then
            PAPER_COUNT=$(wc -l < "$LATEST_JSONL")
            echo "**Papers Analyzed:** $PAPER_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "**JSONL file:** \`$LATEST_JSONL\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Papers Analyzed:** ⚠️ No JSONL file found (pipeline may have failed)" >> $GITHUB_STEP_SUMMARY
          fi

          # Check for generated Markdown report
          LATEST_MD=$(ls -t data/reports/report_*.md 2>/dev/null | head -1)
          if [ -n "$LATEST_MD" ]; then
            MD_LINES=$(wc -l < "$LATEST_MD")
            echo "**Markdown report:** \`$LATEST_MD\` ($MD_LINES lines)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Markdown report:** ⚠️ Not found" >> $GITHUB_STEP_SUMMARY
          fi

          # Check for generated website files
          if [ -d "jekyll_site/_site" ]; then
            WEB_FILES=$(find jekyll_site/_site -type f -name "*.html" | wc -l)
            echo "**Website Files Generated:** $WEB_FILES HTML files" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Email status from pipeline log ──────────────────────────
          echo "### 📧 Email Status" >> $GITHUB_STEP_SUMMARY
          if [ "${EMAIL_ENABLED}" = "true" ]; then
            echo "- EMAIL_ENABLED: ✅ true" >> $GITHUB_STEP_SUMMARY
          else
            echo "- EMAIL_ENABLED: ❌ not enabled (set GitHub Secret \`EMAIL_ENABLED=true\` to enable)" >> $GITHUB_STEP_SUMMARY
          fi
          # Show actual send result from log
          if [ -f /tmp/email_status.txt ] && [ -s /tmp/email_status.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pipeline log — email lines:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/email_status.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Quick pass/fail check
          if grep -qi "sent successfully" /tmp/email_status.txt 2>/dev/null; then
            echo "- **Result: ✅ Email sent successfully**" >> $GITHUB_STEP_SUMMARY
          elif grep -qi "failed\|error\|disabled\|skipping" /tmp/email_status.txt 2>/dev/null; then
            echo "- **Result: ❌ Email not sent** (see log above)" >> $GITHUB_STEP_SUMMARY
          elif [ "${EMAIL_ENABLED}" = "true" ]; then
            echo "- **Result: ⚠️ No email log found** (pipeline may have not reached email step)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- LLM Provider: Generic OpenAI-compatible API" >> $GITHUB_STEP_SUMMARY
          echo "- RSS Sources: 21 sources (arXiv × 3, Nature × 5, Science × 2, APS × 8, Other × 3)" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Secrets used: LLM_API_KEY, LLM_BASE_URL, LLM_MODEL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** GitHub Pages (built by workflow, deployed from master)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline completed successfully!" >> $GITHUB_STEP_SUMMARY
