name: Test Email — SMTP Only

# 仅测试 SMTP 连通性和邮件发送，不运行 pipeline
on:
  workflow_dispatch:
    inputs:
      recipient_override:
        description: "覆盖收件人（留空则使用 EMAIL_RECIPIENT secret）"
        required: false
        default: ""

jobs:
  test-smtp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────
      # Step 1: Network diagnostics
      # 诊断 GitHub Actions runner 到 SMTP 服务器的网络连通性
      # ─────────────────────────────────────────────────────────────────
      - name: Network diagnostics
        env:
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT:   ${{ secrets.EMAIL_SMTP_PORT }}
        run: |
          SERVER="$EMAIL_SMTP_SERVER"
          CONFIGURED_PORT="${EMAIL_SMTP_PORT:-587}"

          echo "=== Network Diagnostics ==="
          echo "SMTP Server  : $SERVER"
          echo "Configured Port: $CONFIGURED_PORT"
          echo ""

          check_port() {
            local PORT=$1
            local LABEL=$2
            if timeout 10 bash -c "echo '' | nc -w 5 $SERVER $PORT 2>/dev/null"; then
              echo "✅ Port $PORT ($LABEL): REACHABLE"
            else
              echo "❌ Port $PORT ($LABEL): UNREACHABLE or TIMED OUT"
            fi
          }

          # Test configured port first
          echo "--- Configured port: $CONFIGURED_PORT ---"
          check_port "$CONFIGURED_PORT" "configured"

          # Test other common ports
          for TEST_PORT in 465 587 25; do
            if [ "$TEST_PORT" != "$CONFIGURED_PORT" ]; then
              echo ""
              LABEL="STARTTLS"
              [ "$TEST_PORT" = "465" ] && LABEL="SSL"
              [ "$TEST_PORT" = "25"  ] && LABEL="legacy, expected blocked"
              check_port "$TEST_PORT" "$LABEL"
            fi
          done

          echo ""
          echo "=== Runner IP (for server whitelist check) ==="
          curl -s https://api.ipify.org && echo ""

      # ─────────────────────────────────────────────────────────────────
      # Step 2: Send test email
      # 尝试 STARTTLS(587) 和 SSL(465) 两种方式发送
      # ─────────────────────────────────────────────────────────────────
      - name: Send test email
        env:
          EMAIL_SENDER:        ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT:     ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SMTP_SERVER:   ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT:     ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          RECIPIENT_OVERRIDE:  ${{ inputs.recipient_override }}
        run: |
          python3 - <<'PYEOF'
          import os, smtplib, socket
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime, timezone

          sender      = os.environ["EMAIL_SENDER"]
          recipient   = os.environ.get("RECIPIENT_OVERRIDE") or os.environ["EMAIL_RECIPIENT"]
          smtp_server = os.environ["EMAIL_SMTP_SERVER"]
          smtp_port   = int(os.environ.get("EMAIL_SMTP_PORT", "587"))
          username    = os.environ["EMAIL_SMTP_USERNAME"]
          password    = os.environ["EMAIL_SMTP_PASSWORD"]
          run_time    = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          subject = f"[TEST] Quantum RSS Radar SMTP Test — {run_time}"
          body_html = f"""
          <html><body>
          <h2>✅ Quantum RSS Radar — SMTP 测试成功</h2>
          <p><b>发送时间：</b>{run_time}</p>
          <p><b>SMTP 服务器：</b>{smtp_server}:{smtp_port}</p>
          <p><b>发件人：</b>{sender}</p>
          <p><b>收件人：</b>{recipient}</p>
          <hr>
          <p>如果您收到此邮件，说明 SMTP 配置完全正确 ✅</p>
          <p><small>由 GitHub Actions 自动发送 — Quantum RSS Radar</small></p>
          </body></html>"""

          msg = MIMEMultipart("alternative")
          msg["Subject"] = subject
          msg["From"]    = sender
          msg["To"]      = recipient
          msg.attach(MIMEText(body_html, "html"))
          msg.attach(MIMEText(f"SMTP Test OK — {run_time}", "plain"))

          last_error = None

          # ── Build port list: configured port FIRST, then fallback ────
          # Port 465 → SSL, Port 587 → STARTTLS, others → STARTTLS
          def mode_for_port(p):
              return "ssl" if p == 465 else "starttls"

          ports_to_try = [(smtp_port, mode_for_port(smtp_port))]
          print(f"Configured port: {smtp_port} ({mode_for_port(smtp_port).upper()})")

          # Add fallback only if different from configured
          for fallback_port in [465, 587]:
              if fallback_port != smtp_port:
                  ports_to_try.append((fallback_port, mode_for_port(fallback_port)))

          for port, mode in ports_to_try:
              print(f"\nTrying {smtp_server}:{port} ({mode.upper()}) ...")
              try:
                  if mode == "ssl":
                      import ssl
                      ctx = ssl.create_default_context()
                      with smtplib.SMTP_SSL(smtp_server, port, timeout=30, context=ctx) as server:
                          server.login(username, password)
                          server.send_message(msg)
                  else:
                      with smtplib.SMTP(smtp_server, port, timeout=30) as server:
                          server.ehlo()
                          server.starttls()
                          server.ehlo()
                          server.login(username, password)
                          server.send_message(msg)
                  print(f"✅ Email sent successfully via {smtp_server}:{port} ({mode.upper()})")
                  print(f"   Recipient: {recipient}")
                  exit(0)
              except Exception as e:
                  print(f"❌ Failed on port {port} ({mode}): {type(e).__name__}: {e}")
                  last_error = e

          # All attempts failed
          print(f"\n❌ All SMTP attempts failed. Last error: {last_error}")
          print("""
          ════════════════════════════════════════════════════════
          TROUBLESHOOTING for Outlook.com / Office365:
          ════════════════════════════════════════════════════════
          1. Enable SMTP AUTH in Outlook settings:
             https://outlook.live.com/mail/0/options/mail/accounts/popImap
             → Turn on "Let devices and apps use POP"
             → SMTP AUTH must be enabled

          2. GitHub Actions runs on Azure. Microsoft may block
             SMTP from Azure to Outlook.com. Consider using:
             • QQ Mail:     smtp.qq.com      port 587  (STARTTLS)
             • 163 Mail:    smtp.163.com     port 465  (SSL)
             • Gmail:       smtp.gmail.com   port 587  (App Password required)
             • SendGrid:    smtp.sendgrid.net port 587  (free 100/day)

          3. For Gmail — use an App Password:
             Google Account → Security → 2-Step Verification
             → App passwords → Generate

          4. For QQ/163 — use SMTP authorization code:
             QQ Mail settings → Account → Enable SMTP → Get auth code
          ════════════════════════════════════════════════════════
          """)
          exit(1)
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "## 📧 SMTP 连通性测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**运行时间:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "查看 **Network diagnostics** 步骤日志确认端口是否可达。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 常见原因（连接超时）" >> $GITHUB_STEP_SUMMARY
          echo "| 原因 | 解决方案 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Outlook SMTP AUTH 未开启 | 登录 outlook.com → 设置 → 邮件 → 同步邮件 → 开启 POP/SMTP |" >> $GITHUB_STEP_SUMMARY
          echo "| Azure→Office365 SMTP 被微软限制 | 换用 QQ/163/Gmail/SendGrid |" >> $GITHUB_STEP_SUMMARY
          echo "| 端口 587 被封 | 尝试端口 465 (SSL)，代码已自动重试 |" >> $GITHUB_STEP_SUMMARY
