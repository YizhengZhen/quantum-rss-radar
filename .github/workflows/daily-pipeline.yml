name: Quantum RSS Radar - Daily Pipeline

on:
  schedule:
    # Run daily at 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'config/**'
      - '.github/workflows/daily-pipeline.yml'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Setup uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv sync
    
    - name: Check configuration
      run: |
        # Always use example config for GitHub Actions
        cp config/settings.yaml.example config/settings.yaml
        echo "Using example configuration with environment variables"
        
        # Verify required environment variables are set
        if [ -z "$LLM_API_KEY" ]; then
          echo "Warning: LLM_API_KEY environment variable not set"
          echo "You need to set LLM_API_KEY as a GitHub Secret"
        fi
    
    - name: Run Quantum RSS Radar
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
        EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
        EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      run: |
        source .venv/bin/activate
        echo "Running Quantum RSS Radar with configuration:"
        echo "  LLM_BASE_URL: ${LLM_BASE_URL:-Not set (using default)}"
        echo "  LLM_MODEL: ${LLM_MODEL:-Not set (using default)}"
        echo "  LLM_API_KEY: ${LLM_API_KEY:0:10}... (first 10 chars)"
        
        # Run the orchestrator (Jekyll version)
        python -m src.orchestrator_jekyll
    
    - name: Build Jekyll Site
      if: success()
      run: |
        echo "Building Jekyll site..."
        cd jekyll_site
        
        # Install Jekyll dependencies if needed
        if [ -f "Gemfile" ]; then
          bundle install
          bundle exec jekyll build
        else
          echo "No Gemfile found, skipping Jekyll build"
        fi
    
    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./jekyll_site/_site
        publish_branch: gh-pages
        force_orphan: true
        keep_files: false
    
    - name: Create deployment summary
      if: always()
      run: |
        echo "## Quantum RSS Radar Pipeline" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Run Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for processed papers
        if [ -f "data/processed/papers_analyzed.jsonl" ]; then
          PAPER_COUNT=$(wc -l < data/processed/papers_analyzed.jsonl)
          echo "**Papers Analyzed:** $PAPER_COUNT" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Papers Analyzed:** 0" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check for generated website files
        if [ -d "jekyll_site/_site" ]; then
          WEB_FILES=$(find jekyll_site/_site -type f -name "*.html" | wc -l)
          echo "**Website Files Generated:** $WEB_FILES" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Website URL:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
        echo "- LLM Provider: Generic OpenAI-compatible API" >> $GITHUB_STEP_SUMMARY
        echo "- RSS Sources: arXiv Quantum Physics (quant-ph)" >> $GITHUB_STEP_SUMMARY
        echo "- GitHub Secrets used: LLM_API_KEY, LLM_BASE_URL, LLM_MODEL" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Pipeline completed successfully!" >> $GITHUB_STEP_SUMMARY